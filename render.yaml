services:
  - type: web
    name: fraud-detection-backend
    runtime: docker
    plan: free
    dockerfilePath: ./frauddetection/Dockerfile
    dockerContext: ./frauddetection
    healthCheckPath: /health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ML_API_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
